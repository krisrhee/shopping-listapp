<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쇼핑 리스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        .list-container {
            max-height: 400px;
            overflow-y: auto;
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .list-item:hover {
            background: #efefef;
        }

        .list-item.completed {
            opacity: 0.6;
        }

        .list-item.completed .item-text {
            text-decoration: line-through;
            color: #999;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .item-text {
            flex: 1;
            font-size: 16px;
            color: #333;
            word-break: break-word;
        }

        .delete-btn {
            padding: 8px 12px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .delete-btn:hover {
            background: #ff5252;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 16px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            display: block;
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 쇼핑 리스트</h1>

        <div class="input-group">
            <input
                type="text"
                id="itemInput"
                placeholder="물건을 입력하세요..."
                autocomplete="off"
            >
            <button onclick="addItem()">추가</button>
        </div>

        <div class="list-container" id="listContainer">
            <div class="empty-message">항목을 추가하여 시작하세요!</div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" id="totalCount">0</span>
                <span>전체</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="completedCount">0</span>
                <span>완료</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="remainCount">0</span>
                <span>남음</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://xgfcgrgusgqnscfoilxy.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_dYBgzolk8Sro16q-J5gEDg_8GIWON3p';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let items = [];

        async function loadItems() {
            const { data, error } = await supabase
                .from('shopping_items')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('Error loading items:', error);
                alert('항목을 불러오는 중 오류가 발생했습니다.');
                return;
            }

            items = data || [];
            renderList();
        }

        async function addItem() {
            const input = document.getElementById('itemInput');
            const text = input.value.trim();

            if (!text) {
                alert('물건을 입력하세요!');
                return;
            }

            const { error } = await supabase
                .from('shopping_items')
                .insert([{ text: text, completed: false }]);

            if (error) {
                console.error('Error adding item:', error);
                alert('항목을 추가하는 중 오류가 발생했습니다.');
                return;
            }

            input.value = '';
            input.focus();
            await loadItems();
        }

        async function deleteItem(id) {
            const { error } = await supabase
                .from('shopping_items')
                .delete()
                .eq('id', id);

            if (error) {
                console.error('Error deleting item:', error);
                alert('항목을 삭제하는 중 오류가 발생했습니다.');
                return;
            }

            await loadItems();
        }

        async function toggleItem(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            const { error } = await supabase
                .from('shopping_items')
                .update({ completed: !item.completed })
                .eq('id', id);

            if (error) {
                console.error('Error updating item:', error);
                alert('항목을 업데이트하는 중 오류가 발생했습니다.');
                return;
            }

            await loadItems();
        }

        function updateStats() {
            const total = items.length;
            const completed = items.filter(i => i.completed).length;
            const remain = total - completed;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('remainCount').textContent = remain;
        }

        function renderList() {
            const container = document.getElementById('listContainer');

            if (items.length === 0) {
                container.innerHTML = '<div class="empty-message">항목을 추가하여 시작하세요!</div>';
                updateStats();
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="list-item ${item.completed ? 'completed' : ''}">
                    <input
                        type="checkbox"
                        ${item.completed ? 'checked' : ''}
                        onchange="toggleItem(${item.id})"
                    >
                    <span class="item-text">${escapeHtml(item.text)}</span>
                    <button class="delete-btn" onclick="deleteItem(${item.id})">삭제</button>
                </div>
            `).join('');

            updateStats();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('itemInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addItem();
            }
        });

        loadItems();
    </script>
</body>
</html>
